[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-science-basics"
version = "0.1.0"
description = "A basic data science project example"
dependencies = ["Pillow>=9.0.0", "pandas>=1.3.0", "numpy>=1.21.0"]

[tool.setuptools.packages.find]
where = ["src"]